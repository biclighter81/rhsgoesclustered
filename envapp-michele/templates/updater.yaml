apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: michele-updater
spec:
  namespace: argocd
  applicationRefs:
    - namePattern:  MicheleApp
      images:
        - alias: "michele"
          imageName: "mgeorge.registry.qentis.de/applications/environment-app:1.0.x"
          commonUpdateSettings:
            updateStrategy: "semver"
          manifestTargets:
            helm:
              name: "image.repository"
              tag: "image.tag"
